[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[project]
name = "scoparia"
version = "0.0.1"
description = "SCP Forum Activity Notifier"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Crimone" }]
keywords = ["scp", "wikidot", "notification", "github-actions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.11"
dependencies = [
    "aiohttp[speedups]>=3.13.5",
    "anyio>=4.12.1",
    "apprise>=1.10.0",
    "beautifulsoup4[lxml]>=4.14.3",
    "feedparser>=6.0.12",
    "githubkit>=0.15.5",
    "html2text>=2025.4.15",
    "msgspec[yaml]>=0.21.1",
    "o365>=2.1.8",
    "pymongo>=4.17.0",
    "pynacl>=1.6.1",
    "pyyaml>=6.0.3",
    "tenacity>=9.1.2",
    "uvloop>=0.22.1; sys_platform != 'win32'",
    "winloop>=0.6.3; sys_platform == 'win32'",
]

[project.urls]
Documentation = "https://github.com/Crimone/Scoparia/wiki"
Homepage = "https://github.com/Crimone/Scoparia"
Repository = "https://github.com/Crimone/Scoparia"
Issues = "https://github.com/Crimone/Scoparia/issues"

[project.scripts]
scoparia = "scoparia:main"

[dependency-groups]
dev = ["ruff>=0.15.12", "pytest>=9.0.1", "pytest-mock>=3.15.1"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "C90"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
reportPossiblyUnboundVariable = "error"
reportUnreachable = "error"
reportInvalidCast = "error"
reportUnsafeMultipleInheritance = "error"
reportImplicitAbstractClass = "error"
reportInvalidAbstractMethod = "error"

[tool.pytest.ini_options]
anyio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--tb=short"]
